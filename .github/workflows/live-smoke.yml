name: Live Smoke Test

on:
  workflow_dispatch:
  schedule:
    # Every day at 08:00 UTC
    - cron: "0 8 * * *"

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Full demo run
        # Obtains its own fresh sandbox token — no stored secrets needed
        run: npm run demo

      - name: Live smoke tests
        run: npm run test:live
